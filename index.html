<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constructor de Pedidos PRO v26 - Edición Estándar</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #1C3A5E;       /* navy de marca */
            --primary-light: #2c527f;
            --accent-orange: #FF6B35; /* naranja de marca — avisos */
            --bg-light: #ffffff;
            --bg-page: #eef2f6;
            --text-dark: #1C3A5E;
            --accent-blue: #2c527f;
            --accent-green: #1e8e5a;
            --accent-red: #dc3545;
            --btn-whatsapp: #25D366;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; background: var(--bg-page); min-height: 100vh; }
        .container { max-width: 1500px; margin: 0 auto; padding: 20px; }
        .panel { background: var(--bg-light); border: 1px solid #dde3ea; border-radius: 15px; padding: 20px; box-shadow: 0 4px 16px rgba(28, 58, 94, 0.06); }
        h1, h3 { color: var(--text-dark); }
        h1 { text-align: center; margin-bottom: 20px; font-size: 2.5rem; }
        #loading-section { padding: 40px; text-align: center; }
        #main-app { display: none; }
        .config-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; align-items: end; }
        .config-group label { font-weight: 600; margin-bottom: 5px; color: var(--text-dark); display: block; }
        select, input { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; transition: border-color 0.3s ease; background-color: white; }
        .main-content { display: flex; flex-direction: column; gap: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-info { background: var(--accent-blue); color: white; }
        .btn-success { background: var(--accent-green); color: white; }
        .btn-danger { background: var(--accent-red); color: white; }
        .btn-whatsapp { background: var(--btn-whatsapp); color: white; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; max-height: 45vh; overflow-y: auto; padding: 5px; }
        .product-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 12px rgba(28,58,94,0.08); border-left: 4px solid var(--primary); }
        .product-sku { font-weight: 700; color: var(--primary); }
        .product-description { font-size: 13px; color: #666; margin-bottom: 10px; }
        .quantity-input { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
        .order-section-grid { display: grid; grid-template-columns: 1fr 400px; gap: 20px; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #e0e0e0; }
        .order-total { font-size: 18px; font-weight: 700; color: var(--accent-green); }
        .order-items { max-height: 50vh; overflow-y: auto; }
        .order-item { background: #f7f9fb; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; align-items: center; padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--accent-green); position: relative; }
        .order-item-info .sku { font-weight: 600; color: var(--primary); font-size: 14px; }
        .order-item-info .desc { font-size: 12px; color: #666; }
        .aviso-bajo-mayor { font-size: 11px; font-weight: 700; color: #b35400; background: #fff1e6; border: 1px solid var(--accent-orange); border-radius: 4px; padding: 3px 6px; margin-top: 4px; display: inline-block; }
        .aviso-transporte { font-size: 11px; font-weight: 700; color: #1C3A5E; background: #e8f0f9; border: 1px solid var(--primary-light); border-radius: 4px; padding: 3px 6px; margin-top: 4px; display: inline-block; }
        .input-aviso { border: 2px solid var(--accent-orange) !important; }
        .input-aviso-transporte { border: 2px solid var(--primary-light) !important; }
        .order-item-controls { display: flex; align-items: center; gap: 10px; }
        .order-item-controls input[type="number"] { width: 60px; padding: 5px; text-align: center; }
        .price-details { text-align: right; }
        .unit-price-input { width: 80px; text-align: right; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .price-details .line-total { font-size: 14px; font-weight: bold; display: block; margin-top: 5px;}
        .price-override-section { display: flex; gap: 5px; align-items: center; }
        .price-override-section select { font-size: 12px; padding: 5px; flex-grow: 1; }
        .btn-reset { background: var(--accent-orange); color: white; border: 0; border-radius: 4px; padding: 4px 8px; font-size: 10px; cursor: pointer; }
        .btn-remove-item { position: absolute; top: 5px; right: 5px; background: var(--accent-red); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-weight: bold; cursor: pointer; line-height: 22px; text-align: center; font-size: 14px; }
        .global-price-applicator { background: #eaf1f8; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        .global-price-applicator .controls { display: flex; gap: 10px; }
        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;}
        .copy-output { background: var(--text-dark); color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 12px; white-space: pre-wrap; max-height: 200px; overflow-y: auto; margin-top: 10px; }
        .filters-section { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 15px; padding: 15px; background: #f7f9fb; border-radius: 8px; align-items: center;}
        
        /* Estilo para información de cache */
        .cache-info { margin-top: 10px; padding: 8px; background: #f7f9fb; border-radius: 5px; font-size: 12px; color: #666; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .btn-refresh-catalogo { background: var(--primary); color: white; border: none; border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer; font-weight: 600; }
        .catalog-status-bar { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 13px; font-weight: 600; color: var(--accent-green); background: #f7f9fb; border-radius: 8px; padding: 8px 12px; margin: 10px 0 15px; flex-wrap: wrap; }
        
        @media (max-width: 900px) { .order-section-grid { grid-template-columns: 1fr; } .order-item { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading-section" class="panel">
            <h1 style="font-size: 2rem;">Constructor de Pedidos</h1>
            <p id="loading-status" style="color: #1C3A5E; font-weight: 600;">🔄 Cargando catálogo automáticamente...</p>
            <div id="cache-info" class="cache-info" style="display: none;">
                <strong>Estado del cache:</strong> <span id="cache-status"></span>
                <button class="btn-refresh-catalogo" onclick="loadCatalogFromSheets(true)">🔄 Actualizar catálogo</button>
            </div>
        </div>

        <div id="main-app">
            <div class="panel header"><h1>🛍️ Constructor de Pedidos PRO</h1>
                <div class="catalog-status-bar">
                    <span id="catalog-status-persist">🔗 Catálogo conectado</span>
                    <button class="btn-refresh-catalogo" onclick="loadCatalogFromSheets(true)">🔄 Actualizar catálogo</button>
                </div>
                <div class="config-panel">
                    <div class="config-group"><label for="clientName">Nombre Cliente:</label><input type="text" id="clientName" placeholder="Requerido para descarga..."></div>
                    <div class="config-group"><label>Modalidad:</label><select id="deliveryMode"><option value="RETIRO">RETIRO EN BODEGA</option><option value="ENVÍO">ENVÍO A DOMICILIO</option><option value="ENVÍO OFC">ENVÍO A OFICINA</option></select></div>
                    <div class="config-group"><label>Documento:</label><select id="documentType"><option value="BOLETA">BOLETA</option><option value="FACTURA">FACTURA</option></select></div>
                    <div class="config-group"><label>Mostrar Precios:</label><select id="showPrices"><option value="BRUTO">BRUTO (con IVA)</option><option value="NETO">NETO (sin IVA)</option></select></div>
                    <div class="config-group"><label>Importar Pedido:</label><button id="importOrderBtn" class="btn btn-primary" onclick="triggerImport()">Importar</button><input type="file" id="importFile" accept=".csv" style="display:none;"></div>
                </div>
            </div>
            <div class="main-content">
                <div class="panel catalog-section">
                    <h3>Búsqueda de Productos</h3>
                    <div class="filters-section">
                        <input type="text" id="searchInput" placeholder="Buscar por SKU o descripción..." onkeyup="filterProducts()">
                        <select id="categoryFilter" onchange="filterProducts()"><option value="">Todas las Categorías</option></select>
                        <select id="itemsPerPage" onchange="filterProducts()"><option value="50" selected>50</option><option value="100">100</option><option value="all">Todos</option></select>
                    </div>
                    <div id="productsContainer"></div>
                </div>

                <div class="panel order-section">
                    <div class="order-header"><h3>Pedido Actual</h3><div class="order-total" id="orderTotal">$0</div></div>
                    <div class="order-section-grid">
                        <div class="order-items" id="orderItems"></div>
                        <div class="order-actions">
                            <div class="global-price-applicator">
                                <label style="font-weight:600; font-size:14px; display:block; margin-bottom:5px;">Aplicar Precio a Todo:</label>
                                <div class="controls">
                                    <select id="globalPriceSelector"><option value="DETALLE">DETALLE</option><option value="MAYOR">MAYOR</option></select>
                                    <button class="btn btn-primary" style="padding: 5px 10px;" onclick="applyGlobalPrice()">OK</button>
                                </div>
                            </div>
                            <div class="actions-grid">
                                <button class="btn btn-success" onclick="generateExcelOutput()">📋 Copiar Sistema</button>
                                <button class="btn btn-whatsapp" onclick="generateWhatsappSummary()">💬 Copiar WhatsApp</button>
                            </div>
                            <button class="btn btn-primary" onclick="downloadExcel()" style="width:100%; margin-bottom:10px;">📥 Descargar Excel</button>
                            <button class="btn btn-info" onclick="downloadBsaleCsv()" style="width:100%; margin-bottom:10px;">📄 Exportar BSale</button>
                            <button class="btn btn-primary" onclick="generateSummaryNote()" style="width:100%; margin-bottom:10px;">📝 Nota Bodega</button>
                            <button class="btn btn-danger" onclick="clearOrder()" style="width:100%;">🗑️ Limpiar Pedido</button>
                            <div id="copyOutput" class="copy-output" style="display: none; margin-top: 10px;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allProducts = [], pricesBySku = {}, currentOrder = [];

        // 📊 CONEXIÓN EN VIVO A GOOGLE SHEETS — mismas URLs exactas que usan
        // AROCHECK.js / cotizadoraromaker.js / ModuloDocumentos.js / el Corrector
        const SHEETS_CONFIG = {
            principal: { id: '1G-YTvarwG14zc0s7EcLKtvHnBBM7uXiCbFTNttDrqDg', gid: '468760285' },
            excepciones: { id: '171l6JpmS2b1Aq-WDXLiq8d4SMJM75oUXf6Y8xhpd2Jk', gid: '1973237883' }
        };
        function urlHojaCSV(cfg) {
            // 2026-10-20: /export dejó de responder para el catálogo principal (HTTP 400, archivo muy
            // pesado por las imágenes). Para esa hoja se usa /gviz desde la fila de encabezados (A2),
            // que entrega exactamente las mismas columnas y datos.
            if (cfg.id === SHEETS_CONFIG.principal.id) {
                return `https://docs.google.com/spreadsheets/d/${cfg.id}/gviz/tq?tqx=out:csv&headers=1&range=A2:Z&gid=${cfg.gid}`;
            }
            return `https://docs.google.com/spreadsheets/d/${cfg.id}/export?format=csv&gid=${cfg.gid}`;
        }
        function fetchConTimeout(url, ms = 15000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), ms);
            return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
        }

        function normalizarSKU(s) { if (!s) return ""; return String(s).toUpperCase().replace(/\s+/g, "").replace(/[^A-Z0-9-]/g, ""); }
        function limpiarValor(v) { if (typeof v === 'number') return v; if (typeof v !== 'string' || v.trim() === '') return null; try { let cleanStr = String(v).replace(/[$\s]/g, ''); const lastDot = cleanStr.lastIndexOf('.'); const lastComma = cleanStr.lastIndexOf(','); if (lastComma > lastDot) { return parseFloat(cleanStr.replace(/\./g, '').replace(',', '.')); } if (lastDot > lastComma) { const parts = cleanStr.split('.'); if (parts.length > 1 && parts[parts.length - 1].length !== 3) { return parseFloat(cleanStr); } return parseFloat(cleanStr.replace(/\./g, '')); } return parseFloat(cleanStr); } catch (e) { return null; } }
        function normalizarTextoCatalogo(s) { return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
        // Las 3 familias de excepción vienen SIEMPRE de Catálogo Excepciones, nunca del principal
        // (misma regla exacta que AROCHECK.js / ModuloDocumentos.js / cotizadoraromaker.js / el Corrector)
        function esFamiliaExcluidaDePrincipal(categoria) {
            const c = normalizarTextoCatalogo(categoria);
            if (/lata sani.?air hogar/.test(c)) return true;
            if (/lata auto/.test(c)) return true;
            if (/tabletas aromaticas/.test(c)) return true;
            return false;
        }
        function esCategoriaTransporte(categoria) {
            return /transporte/.test(normalizarTextoCatalogo(categoria));
        }
        // Busca una columna por nombre de encabezado (insensible a mayúsculas/acentos).
        // Primero intenta coincidencia EXACTA; si no encuentra nada, prueba coincidencia
        // por CONTENIDO (el encabezado real contiene el nombre buscado). El parámetro
        // "desde" permite empezar a buscar a partir de una columna específica — se usa,
        // por ejemplo, para encontrar la SEGUNDA columna "NETO" (la de Mayor) y no
        // quedarse siempre con la primera (la de Detalle).
        function encontrarIndiceColumna(header, nombres, desde = 0) {
            const normalizados = nombres.map(normalizarTextoCatalogo);
            for (let i = desde; i < header.length; i++) {
                if (normalizados.includes(normalizarTextoCatalogo(header[i]))) return i;
            }
            for (let i = desde; i < header.length; i++) {
                const h = normalizarTextoCatalogo(header[i]);
                if (normalizados.some(n => h.includes(n))) return i;
            }
            return -1;
        }

        function registrarPrecio(pricesBySku, products, categories, sku, descripcion, categoria, tipo, neto, bruto) {
            if (bruto == null || bruto <= 0) return;
            if (!pricesBySku[sku]) {
                products.push({ sku, description: descripcion, family: sku.substring(0, 2), priceCategory: categoria || 'General' });
                pricesBySku[sku] = [];
                categories.add(categoria || 'General');
            }
            pricesBySku[sku].push({ type: tipo, net: neto, gross: bruto });
        }

        // Ubica la fila real de encabezados del catálogo principal buscando, dentro de las
        // primeras 10 filas, la que contenga a la vez una columna "CATEGORIA" y una "SKU".
        // Antes se asumía que esa fila era siempre la fila 2 (índice 1) con datos fijos en
        // columnas D-L — eso se rompe apenas alguien agrega, quita o mueve una fila/columna
        // de banner en la hoja. Buscándola por nombre, da igual cuántas filas de banner haya
        // arriba o si queda una fila en blanco entre el encabezado y los datos.
        function detectarEncabezadoPrincipal(data) {
            for (let i = 0; i < Math.min(data.length, 10); i++) {
                const row = data[i] || [];
                const iCat = encontrarIndiceColumna(row, ['categoria']);
                const iSku = encontrarIndiceColumna(row, ['sku']);
                if (iCat !== -1 && iSku !== -1) return i;
            }
            return -1;
        }

        // Catálogo principal ("Precios Aromaker"): las columnas (CATEGORIA, DESCRIPCION, SKU,
        // PRECIO DETALLE, NETO, PRECIO MAYOR, NETO, OBSERVACIONES) y la fila de inicio de los
        // datos se detectan por NOMBRE de encabezado, no por letra de columna ni número de fila
        // fijo. Mientras esos títulos de columna se mantengan (aunque cambien de posición, o se
        // borren/agreguen filas), el parseo sigue funcionando.
        // ⚠️ Nunca genera filas VIP/Webalia — este constructor es para vendedores, no deben verlas ni aunque existieran.
        function procesarCatalogoPrincipalSheets(csvText, pricesBySku, products, categories) {
            const data = Papa.parse(csvText, { skipEmptyLines: false }).data;

            const idxHeader = detectarEncabezadoPrincipal(data);
            if (idxHeader === -1) {
                throw new Error('No se encontró la fila de encabezados (CATEGORIA + SKU) en el catálogo principal. Revisa si los títulos de columna cambiaron de nombre.');
            }
            const header = data[idxHeader];

            const iCategoria = encontrarIndiceColumna(header, ['categoria']);
            const iDescripcion = encontrarIndiceColumna(header, ['descripcion']);
            const iSku = encontrarIndiceColumna(header, ['sku']);
            const iPrecioDetalle = encontrarIndiceColumna(header, ['precio detalle (iva incluido)', 'precio detalle']);
            const iNetoDetalle = iPrecioDetalle !== -1 ? encontrarIndiceColumna(header, ['neto'], iPrecioDetalle + 1) : -1;
            const iPrecioMayor = encontrarIndiceColumna(header, ['precio mayor (iva incluido)', 'precio mayor']);
            const iNetoMayor = iPrecioMayor !== -1 ? encontrarIndiceColumna(header, ['neto'], iPrecioMayor + 1) : -1;
            const iObservaciones = encontrarIndiceColumna(header, ['observaciones']);

            if (iCategoria === -1 || iDescripcion === -1 || iSku === -1 || iPrecioDetalle === -1 || iNetoDetalle === -1) {
                throw new Error('Catálogo principal: no se pudieron ubicar todas las columnas obligatorias (CATEGORIA/DESCRIPCION/SKU/PRECIO DETALLE/NETO). Revisa los encabezados de la hoja.');
            }

            for (let i = idxHeader + 1; i < data.length; i++) {
                const row = data[i];
                if (!row) continue;
                const categoria = (row[iCategoria] || '').trim();
                const descripcion = (row[iDescripcion] || '').trim();
                const sku = normalizarSKU(row[iSku]);
                if (!sku) continue; // fila vacía o de separación — se salta sin importar cuántas haya ni en qué posición quede
                // Viene solo de Excepciones. EXCEPCIÓN: la Lata EXÓTICA Auto (FC13852–FC13858) es otro
                // producto: vive en el principal con categoría "AROMATIZACIÓN LATA AUTO" y no está en
                // Excepciones, así que no debe saltarse (misma regla que el Asistente y el Corrector).
                if (esFamiliaExcluidaDePrincipal(categoria) && !/exotica/.test(normalizarTextoCatalogo(descripcion))) continue;
                const detalleBruto = limpiarValor(row[iPrecioDetalle]) || 0;
                const detalleNeto = limpiarValor(row[iNetoDetalle]) || 0;
                const mayorBruto = iPrecioMayor !== -1 ? (limpiarValor(row[iPrecioMayor]) || 0) : 0;
                const mayorNeto = iNetoMayor !== -1 ? (limpiarValor(row[iNetoMayor]) || 0) : 0;
                const observaciones = iObservaciones !== -1 ? (row[iObservaciones] || '').trim() : '';

                if (observaciones.toUpperCase().includes('PRECIO UNICO')) {
                    registrarPrecio(pricesBySku, products, categories, sku, descripcion, categoria, 'PRECIO UNICO', detalleNeto, detalleBruto);
                    continue;
                }
                registrarPrecio(pricesBySku, products, categories, sku, descripcion, categoria, 'DETALLE', detalleNeto, detalleBruto);
                if (mayorBruto > 0) {
                    const matchUmbral = observaciones.match(/MAYOR DESDE (\d+)/i);
                    const umbral = matchUmbral ? matchUmbral[1] : '6';
                    registrarPrecio(pricesBySku, products, categories, sku, descripcion, categoria, `MAYOR ${umbral} UN.`, mayorNeto, mayorBruto);
                }
            }
        }

        // Catálogo de excepciones (CATALOGO_LIMPIO): SOLO se usa para las 3 familias que el catálogo
        // principal excluye a propósito (Lata Sani-Air Hogar, Lata Auto, Tabletas) — su Detalle/Mayor
        // real vive acá. Cualquier PRECIO_VIP / PRECIO_WEBALIA de esta hoja se ignora por completo:
        // este constructor es para vendedores y nunca deben ver ni aplicar un precio especial.
        function procesarCatalogoExcepcionesSheets(csvText, pricesBySku, products, categories) {
            const data = Papa.parse(csvText, { skipEmptyLines: false }).data;
            let idxHeader = -1;
            for (let i = 0; i < Math.min(data.length, 5); i++) {
                if (encontrarIndiceColumna(data[i] || [], ['sku']) !== -1) { idxHeader = i; break; }
            }
            if (idxHeader === -1) return;
            const header = data[idxHeader];
            const iCategoria = encontrarIndiceColumna(header, ['categoria']);
            const iSku = encontrarIndiceColumna(header, ['sku']);
            const iDescripcion = encontrarIndiceColumna(header, ['descripcion']);
            const iPrecioDetalle = encontrarIndiceColumna(header, ['precio_detalle', 'precio detalle']);
            const iPrecioMayor = encontrarIndiceColumna(header, ['precio_mayor', 'precio mayor']);
            const iUmbral = encontrarIndiceColumna(header, ['umbral_mayor', 'umbral mayor']);
            const iNotas = encontrarIndiceColumna(header, ['notas']);
            if (iSku === -1) return;

            for (let i = idxHeader + 1; i < data.length; i++) {
                const row = data[i];
                if (!row) continue;
                const sku = normalizarSKU(row[iSku]);
                if (!sku) continue;
                const categoria = iCategoria !== -1 ? (row[iCategoria] || '').trim() : '';
                const descripcion = iDescripcion !== -1 ? (row[iDescripcion] || '').trim() : '';

                // Ítems tipo "Transporte" (99 Minutos, Fucas, Relámpago, Tutto Pets, etc.): no tienen
                // lista de precio aplicable, el precio se cotiza al momento. Se registran a $0 con
                // tipo "CONSULTAR PRECIO" para que sean buscables/agregables y el vendedor ponga el
                // precio a mano — nunca pasan por las reglas de familia/Detalle/Mayor de abajo.
                if (esCategoriaTransporte(categoria)) {
                    if (!pricesBySku[sku]) {
                        products.push({ sku, description: descripcion, family: sku.substring(0, 2), priceCategory: categoria || 'General' });
                        pricesBySku[sku] = [];
                        categories.add(categoria || 'General');
                    }
                    pricesBySku[sku].push({ type: 'CONSULTAR PRECIO', net: 0, gross: 0 });
                    continue;
                }

                if (!esFamiliaExcluidaDePrincipal(categoria)) continue; // no es una de las 3 familias: su Detalle/Mayor ya vino del principal
                const precioDetalle = iPrecioDetalle !== -1 ? (limpiarValor(row[iPrecioDetalle]) || 0) : 0;
                const precioMayor = iPrecioMayor !== -1 ? (limpiarValor(row[iPrecioMayor]) || 0) : 0;
                const notas = iNotas !== -1 ? (row[iNotas] || '').trim() : '';

                if (precioDetalle > 0) {
                    registrarPrecio(pricesBySku, products, categories, sku, descripcion, categoria, 'DETALLE', Math.round(precioDetalle / 1.19), precioDetalle);
                }
                if (precioMayor > 0) {
                    const matchUmbral = notas.match(/MAYOR DESDE (\d+)/i) || notas.match(/MAYOR\s*(\d+)/i);
                    const umbral = matchUmbral ? matchUmbral[1] : ((iUmbral !== -1 ? (row[iUmbral] || '').trim() : '') || '6');
                    registrarPrecio(pricesBySku, products, categories, sku, descripcion, categoria, `MAYOR ${umbral} UN.`, Math.round(precioMayor / 1.19), precioMayor);
                }
            }
        }

        function terminarCargaCatalogo(products, pricesBySkuNuevo, categories) {
            allProducts = products.sort((a, b) => a.description.localeCompare(b.description));
            pricesBySku = pricesBySkuNuevo;
            const catFilter = document.getElementById('categoryFilter');
            catFilter.innerHTML = '<option value="">Todas las Categorías</option>';
            Array.from(categories).sort().forEach(c => catFilter.innerHTML += `<option value="${c}">${c}</option>`);
            clearProductDisplay();
            updateOrderDisplay();
            document.getElementById('loading-section').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        }

        function actualizarBarraPersistente(texto, color) {
            const el = document.getElementById('catalog-status-persist');
            if (el) { el.textContent = texto; el.style.color = color; }
        }

        async function loadCatalogFromSheets(forzarRefresco = false) {
            const statusEl = document.getElementById('loading-status');
            const cacheInfoEl = document.getElementById('cache-info');
            const cacheStatusEl = document.getElementById('cache-status');
            const CACHE_DURATION = 4 * 60 * 60 * 1000; // 4 horas

            const cachedRaw = localStorage.getItem('constructorStandardCacheV2');
            const cacheTime = localStorage.getItem('constructorStandardCacheTimeV2');
            const cacheValid = cachedRaw && cacheTime && (Date.now() - parseInt(cacheTime)) < CACHE_DURATION;

            const usarCache = (motivo) => {
                if (!cachedRaw) return false;
                try {
                    const parsed = JSON.parse(cachedRaw);
                    if (!parsed || !parsed.products || !parsed.pricesBySku) throw new Error('formato de cache inesperado');
                    terminarCargaCatalogo(parsed.products, parsed.pricesBySku, new Set(parsed.products.map(p => p.priceCategory)));
                    statusEl.textContent = motivo;
                    statusEl.style.color = motivo.includes('⚠️') ? '#f0ad4e' : 'var(--accent-green)';
                    cacheInfoEl.style.display = 'block';
                    cacheStatusEl.textContent = `${allProducts.length} productos en cache`;
                    actualizarBarraPersistente(`${motivo} — ${allProducts.length} productos`, motivo.includes('⚠️') ? '#f0ad4e' : 'var(--accent-green)');
                    return true;
                } catch (e) {
                    console.warn('Cache local con formato viejo/corrupto, se descarta:', e.message);
                    localStorage.removeItem('constructorStandardCacheV2');
                    localStorage.removeItem('constructorStandardCacheTimeV2');
                    return false;
                }
            };

            if (!forzarRefresco && cacheValid) { if (usarCache('✅ Catálogo desde cache local')) return; }

            statusEl.textContent = '🔗 Conectando a Google Sheets...';
            statusEl.style.color = '';
            actualizarBarraPersistente('🔗 Conectando a Google Sheets...', 'var(--text-dark)');
            try {
                const [respPrincipal, respExcepciones] = await Promise.all([
                    fetchConTimeout(urlHojaCSV(SHEETS_CONFIG.principal)),
                    fetchConTimeout(urlHojaCSV(SHEETS_CONFIG.excepciones))
                ]);
                if (!respPrincipal.ok) throw new Error('No se pudo conectar a la hoja principal');
                const csvPrincipal = await respPrincipal.text();
                const csvExcepciones = respExcepciones.ok ? await respExcepciones.text() : '';

                const products = [], pricesBySkuNuevo = {}, categories = new Set();
                procesarCatalogoPrincipalSheets(csvPrincipal, pricesBySkuNuevo, products, categories);
                if (csvExcepciones) procesarCatalogoExcepcionesSheets(csvExcepciones, pricesBySkuNuevo, products, categories);
                if (products.length === 0) throw new Error('Las hojas respondieron pero no se encontraron productos');

                localStorage.setItem('constructorStandardCacheV2', JSON.stringify({ products, pricesBySku: pricesBySkuNuevo }));
                localStorage.setItem('constructorStandardCacheTimeV2', Date.now().toString());
                terminarCargaCatalogo(products, pricesBySkuNuevo, categories);
                statusEl.textContent = `✅ Conectado a Google Sheets — ${allProducts.length} productos`;
                statusEl.style.color = 'var(--accent-green)';
                cacheInfoEl.style.display = 'block';
                cacheStatusEl.textContent = `Sincronizado hace instantes | válido 4 horas`;
                actualizarBarraPersistente(`✅ Conectado — ${allProducts.length} productos`, 'var(--accent-green)');
            } catch (error) {
                console.error("Constructor: Error al actualizar catálogo:", error);
                if (!usarCache('⚠️ Sin conexión a Sheets — usando última copia local')) {
                    statusEl.textContent = '❌ Error al cargar el catálogo: ' + error.message;
                    statusEl.style.color = 'red';
                    cacheInfoEl.style.display = 'block';
                    cacheStatusEl.textContent = 'Sin conexión y sin cache disponible';
                    actualizarBarraPersistente('❌ Error de conexión — revisa e intenta de nuevo', 'red');
                }
            }
        }

        // getCategoriaPrecios / processCSVData (formato Git legado) eliminados —
        // reemplazados por procesarCatalogoPrincipalSheets / procesarCatalogoExcepcionesSheets
        
        
        function clearProductDisplay() {
            document.getElementById('productsContainer').innerHTML = '<div style="text-align:center;padding:40px;color:#666;">Ingrese un término de búsqueda para comenzar.</div>';
        }

        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;
            if (!searchTerm && !categoryFilter) {
                clearProductDisplay();
                return;
            }
            const itemsPerPage = document.getElementById('itemsPerPage').value;
            let filtered = allProducts.filter(p => 
                (searchTerm && (p.sku.toLowerCase().includes(searchTerm) || p.description.toLowerCase().includes(searchTerm))) ||
                (categoryFilter && p.priceCategory === categoryFilter)
            );
            if (itemsPerPage !== 'all') filtered = filtered.slice(0, parseInt(itemsPerPage));
            displayProducts(filtered);
        }

        function displayProducts(products) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = products.length === 0 
                ? '<div style="text-align:center;padding:20px;">No se encontraron productos para su búsqueda.</div>'
                : `<div class="products-grid">${products.map(p => `
                    <div class="product-card">
                        <div class="product-sku">${p.sku}</div>
                        <div class="product-description">${p.description}</div>
                        <div class="quantity-input">
                            <input type="number" min="1" value="1" id="qty-${p.sku}">
                            <button class="btn btn-primary" onclick="addToOrder('${p.sku}')">Agregar</button>
                        </div>
                    </div>`).join('')}</div>`;
        }
        
        function addToOrder(sku) {
            const product = allProducts.find(p => p.sku === sku);
            const quantity = parseInt(document.getElementById(`qty-${sku}`).value) || 1;
            const existingItem = currentOrder.find(item => item.sku === sku);
            if (existingItem) {
                existingItem.quantity += quantity;
                existingItem.manualLock = false; 
            } else {
                currentOrder.push({ ...product, quantity, manualLock: false });
            }
            document.getElementById(`qty-${sku}`).value = 1;
            updateAllPricesInOrder();
        }

        function removeFromOrder(index) {
            currentOrder.splice(index, 1);
            updateAllPricesInOrder();
        }
        
        function updateQuantityInOrder(index, newQuantityStr) {
            const newQuantity = parseInt(newQuantityStr);
            if (!isNaN(newQuantity) && newQuantity > 0) {
                currentOrder[index].quantity = newQuantity;
                currentOrder[index].manualLock = false;
                updateAllPricesInOrder();
            } else {
                updateOrderDisplay();
            }
        }
        
        function obtenerMayorReferencia(sku) {
            const disponibles = pricesBySku[sku] || [];
            const tiers = disponibles.map(p => ({ ...p, minQty: getTier(p.type).minQty }));
            const mayorTiers = tiers.filter(t => t.minQty > 1);
            if (mayorTiers.length === 0) return null;
            return mayorTiers.reduce((best, current) => current.minQty < best.minQty ? current : best);
        }

        // Ítems tipo Transporte (99 Minutos, Fucas, Relámpago, etc.): no tienen Mayor, el precio
        // se cotiza siempre a mano — por eso llevan un aviso distinto al de "precio bajo Mayor".
        function esItemConsultarPrecio(sku) {
            const precios = pricesBySku[sku] || [];
            return precios.length === 1 && precios[0].type === 'CONSULTAR PRECIO';
        }

        function manuallyUpdatePrice(index, newPriceStr) {
            const newPrice = parseFloat(newPriceStr);
            const item = currentOrder[index];
            const showPrices = document.getElementById('showPrices').value;

            if (isNaN(newPrice) || newPrice < 0) {
                updateOrderDisplay();
                return;
            }

            item.manualLock = true;
            
            if (showPrices === 'BRUTO') {
                item.priceData.gross = newPrice;
                item.priceData.net = newPrice / 1.19;
            } else { // NETO
                item.priceData.net = newPrice;
                item.priceData.gross = newPrice * 1.19;
            }

            item.priceData.type = 'MANUAL';

            // Avisos puramente visuales — NO se guardan ni se incluyen en ningún resumen/exportación.
            if (esItemConsultarPrecio(item.sku)) {
                item._avisoTransporte = true;
                item._avisoBajoMayor = false;
            } else {
                // Solo recuerda en pantalla que un precio bajo Mayor debe respaldarse con firma/correo
                // de quien lo autorizó, fuera de este sistema.
                const mayorRef = obtenerMayorReferencia(item.sku);
                item._avisoBajoMayor = !!(mayorRef && item.priceData.gross < mayorRef.gross);
                item._avisoTransporte = false;
            }

            updateOrderDisplay();
        }

        function updateAllPricesInOrder() {
            const categoryQuantities = currentOrder.reduce((acc, item) => {
                acc[item.priceCategory] = (acc[item.priceCategory] || 0) + item.quantity;
                return acc;
            }, {});
            currentOrder.forEach(item => {
                if (!item.manualLock) {
                    item.priceData = getBestPrice(item.sku, categoryQuantities[item.priceCategory]);
                    item._avisoBajoMayor = false;
                    item._avisoTransporte = esItemConsultarPrecio(item.sku);
                }
            });
            updateOrderDisplay();
        }
        
        function getTier(priceTypeStr) {
            const type = (priceTypeStr || '').toUpperCase();
            let minQty = 0;
            const match = type.match(/(\d+)/);
            if (type.includes('DETALLE')) minQty = 1;
            else if (type.includes('MAYOR') && !match) minQty = 2;
            else if (match) minQty = parseInt(match[1], 10);
            return { type: priceTypeStr, minQty };
        }
        
        function getBestPrice(sku, totalCategoryQuantity) {
            const availablePrices = pricesBySku[sku] || [];
            if (availablePrices.length === 0) return { type: "SIN PRECIO", net: 0, gross: 0 };
            const tiers = availablePrices.map(p => ({ ...p, minQty: getTier(p.type).minQty }));
            const applicableTiers = tiers.filter(t => totalCategoryQuantity >= t.minQty);
            if (applicableTiers.length > 0) return applicableTiers.reduce((best, current) => current.minQty > best.minQty ? current : best);
            return tiers.find(t => t.type.includes(document.getElementById('globalPriceSelector').value.toUpperCase())) || tiers[0];
        }

        function manuallySetPrice(index, newType) {
            const item = currentOrder[index];
            if (newType === 'MANUAL') return; 
            const newPrice = pricesBySku[item.sku].find(p => p.type === newType);
            if (newPrice) {
                item.priceData = newPrice;
                item.manualLock = true;
                updateOrderDisplay();
            }
        }
        
        function resetPrice(index) {
            currentOrder[index].manualLock = false;
            currentOrder[index].priceData.type = ''; 
            currentOrder[index]._avisoBajoMayor = false;
            currentOrder[index]._avisoTransporte = false;
            updateAllPricesInOrder();
        }

        function applyGlobalPrice() {
            const globalType = document.getElementById('globalPriceSelector').value.toUpperCase();
            let updatedCount = 0;
            currentOrder.forEach(item => {
                let targetPrice;
                const availablePrices = pricesBySku[item.sku] || [];
                if (globalType === 'MAYOR') {
                    const tiers = availablePrices.map(p => ({ ...p, minQty: getTier(p.type).minQty }));
                    const mayorTiers = tiers.filter(t => t.minQty > 1);
                    if (mayorTiers.length > 0) {
                        targetPrice = mayorTiers.reduce((best, current) => current.minQty < best.minQty ? current : best);
                    }
                } else {
                    targetPrice = availablePrices.find(p => p.type.toUpperCase().includes(globalType));
                }
                if (targetPrice) {
                    item.priceData = targetPrice;
                    item.manualLock = true;
                    updatedCount++;
                }
            });
            if (updatedCount > 0) updateOrderDisplay();
            else alert(`No se encontraron precios del tipo "${globalType}" para aplicar.`);
        }

        function updateOrderDisplay() {
            const container = document.getElementById('orderItems');
            const totalEl = document.getElementById('orderTotal');
            const showPrices = document.getElementById('showPrices').value;

            if (currentOrder.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#666;padding:20px;">No hay productos en el pedido.</div>';
                totalEl.textContent = '$0'; return;
            }

            let grandTotal = 0;
            container.innerHTML = currentOrder.sort((a,b) => a.description.localeCompare(b.description)).map((item, index) => {
                const originalIndex = currentOrder.indexOf(item);
                const price = item.priceData;
                const unitPrice = showPrices === 'BRUTO' ? price.gross : price.net;
                const lineTotal = unitPrice * item.quantity;
                grandTotal += lineTotal;
                
                let priceOptions = (pricesBySku[item.sku] || []).map(p => `<option value="${p.type}" ${p.type === price.type ? 'selected' : ''}>${p.type}</option>`).join('');
                if (item.manualLock && item.priceData.type === 'MANUAL') {
                    priceOptions = `<option value="MANUAL" selected>MANUAL</option>${priceOptions}`;
                }

                return `<div class="order-item">
                    <button class="btn-remove-item" onclick="removeFromOrder(${originalIndex})">×</button>
                    <div class="order-item-info">
                        <div class="sku">${item.sku}</div>
                        <div class="desc">${item.description}</div>
                        ${item._avisoBajoMayor ? `<div class="aviso-bajo-mayor">⚠️ Precio bajo Mayor — respaldar con firma y/o correo de quien autorizó</div>` : ''}
                        ${item._avisoTransporte ? `<div class="aviso-transporte">💡 Cotizar: Ajustar precios pensando en que nunca se cobre menos de la base, y con dif a favor para Aromaker, ajustar en caso de ser necesario a la baja pero nunca por debajo de la base minima</div>` : ''}
                    </div>
                    <div class="order-item-controls">
                        <input type="number" value="${item.quantity}" min="1" onchange="updateQuantityInOrder(${originalIndex}, this.value)">
                        <div class="price-details">
                            <input type="number" class="unit-price-input${item._avisoBajoMayor ? ' input-aviso' : ''}${item._avisoTransporte ? ' input-aviso-transporte' : ''}" value="${Math.round(unitPrice)}" onchange="manuallyUpdatePrice(${originalIndex}, this.value)">
                            <b class="line-total">${lineTotal.toLocaleString('es-CL')}</b>
                        </div>
                    </div>
                    <div class="price-override-section">
                        <select onchange="manuallySetPrice(${originalIndex}, this.value)">${priceOptions}</select>
                        ${item.manualLock ? `<button class="btn-reset" onclick="resetPrice(${originalIndex})">Reset</button>` : ''}
                    </div>
                </div>`;
            }).join('');
            totalEl.textContent = `${grandTotal.toLocaleString('es-CL')}`;
        }
        
        function clearOrder() {
            if (confirm('¿Deseas limpiar el pedido?')) {
                currentOrder = [];
                updateOrderDisplay();
            }
        }
        
        function generateExcelOutput() {
            if (currentOrder.length === 0) { alert('No hay productos'); return; }
            const showPrices = document.getElementById('showPrices').value;
            let output = 'Cantidad\tCódigo de Barras, SKU o Número de Serie\tGlosa\tValor Unitario\n';
            currentOrder.sort((a,b) => a.description.localeCompare(b.description)).forEach(item => {
                const unitPrice = showPrices === 'BRUTO' ? item.priceData.gross : item.priceData.net;
                output += `${item.quantity}\t${item.sku}\t${item.description}\t${Math.round(unitPrice)}\n`;
            });
            copyToClipboard(output, '¡Texto para Sistema copiado!');
        }
        
        function generateWhatsappSummary() {
            if (currentOrder.length === 0) { alert('No hay productos'); return; }
            const showPrices = document.getElementById('showPrices').value;
            const currencyFormat = { style: 'currency', currency: 'CLP' };
            const grandTotal = currentOrder.reduce((sum, item) => sum + (showPrices === 'BRUTO' ? item.priceData.gross : item.priceData.net) * item.quantity, 0);
            const groupedByCategory = currentOrder.reduce((acc, item) => {
                if (!acc[item.priceCategory]) acc[item.priceCategory] = { items: [], totalQty: 0 };
                acc[item.priceCategory].items.push(item);
                acc[item.priceCategory].totalQty += item.quantity;
                return acc;
            }, {});

            let note = '*Resumen de Pedido* 🛍️\n\n';
            Object.keys(groupedByCategory).sort().forEach(category => {
                const group = groupedByCategory[category];
                note += `*${category}* (Total: ${group.totalQty} unidades)\n`;
                group.items.sort((a,b) => a.description.localeCompare(b.description)).forEach(item => {
                    const unitPrice = showPrices === 'BRUTO' ? item.priceData.gross : item.priceData.net;
                    const lineTotal = unitPrice * item.quantity;
                    note += `- ${item.quantity} x ${item.description} (${unitPrice.toLocaleString('es-CL', currencyFormat)}) = ${lineTotal.toLocaleString('es-CL', currencyFormat)}\n`;
                });
                note += '\n';
            });
            note += `--------------------\n*Total Estimado: ${grandTotal.toLocaleString('es-CL', currencyFormat)}*`;
            
            copyToClipboard(note, '¡Resumen para WhatsApp copiado!');
        }

        function generateSummaryNote() {
            if (currentOrder.length === 0) { alert('No hay productos'); return; }
            const delivery = document.getElementById('deliveryMode').value;
            const docType = document.getElementById('documentType').value;
            const unitsByCategory = currentOrder.reduce((acc, item) => {

        function downloadExcel() {
            if (currentOrder.length === 0) { alert('No hay productos en el pedido.'); return; }
            const clientName = document.getElementById('clientName').value.trim();
            if (!clientName) { alert('Por favor, ingrese un nombre de cliente.'); return; }
            const fileName = `${clientName.replace(/ /g, "_")}.csv`;
            
            const toCsvRow = (arr) => arr.map(val => `"${String(val).replace(/"/g, '""')}"`).join(',');
            
            let csvContent = "\uFEFF";

            const metaHeaders = ['META_CLIENTE', 'META_MODALIDAD', 'META_DOCUMENTO', 'META_VISTA_PRECIOS'];
            const metaValues = [
                clientName,
                document.getElementById('deliveryMode').value,
                document.getElementById('documentType').value,
                document.getElementById('showPrices').value
            ];
            csvContent += toCsvRow(metaHeaders) + '\r\n';
            csvContent += toCsvRow(metaValues) + '\r\n\r\n';

            const productHeaders = ['Cantidad', 'Código de Barras, SKU o Número de Serie', 'Glosa', 'Valor Unitario'];
            csvContent += toCsvRow(productHeaders) + '\r\n';

            currentOrder.sort((a,b) => a.description.localeCompare(b.description)).forEach(item => {
                const showPrices = document.getElementById('showPrices').value;
                const unitPrice = showPrices === 'BRUTO' ? item.priceData.gross : item.priceData.net;
                const row = [item.quantity, item.sku, item.description, Math.round(unitPrice)];
                csvContent += toCsvRow(row) + '\r\n';
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", fileName);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadBsaleCsv() {
            if (currentOrder.length === 0) { alert('No hay productos en el pedido.'); return; }
            const clientName = document.getElementById('clientName').value.trim();
            const fileName = `BSale_${clientName.replace(/ /g, "_") || 'pedido'}.csv`;

            const blob = new Blob([content], { type: 'text/tab-separated-values;charset=utf-8;' });

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        function importOrder(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (currentOrder.length > 0 && !confirm('¿Importar este pedido? Se reemplazará el pedido actual.')) {
                event.target.value = ''; return;
            }

            Papa.parse(file, {
                header: false,
                skipEmptyLines: true,
                complete: (results) => {
                    const data = results.data;
                    if (data.length > 1 && data[0][0] === 'META_CLIENTE') {
                        const metaValues = data[1];
                        document.getElementById('clientName').value = metaValues[0];
                        document.getElementById('deliveryMode').value = metaValues[1];
                        document.getElementById('documentType').value = metaValues[2];
                        document.getElementById('showPrices').value = metaValues[3];
                    }

                    const headerRowIndex = data.findIndex(row => row[0] === 'Cantidad');
                    if(headerRowIndex === -1) {
                         alert('No se encontró la cabecera de productos en el archivo. No se puede importar.');
                         return;
                    }

                    const productData = data.slice(headerRowIndex + 1);
                    const newOrder = [];
                    const notFound = [];

                    productData.forEach(row => {
                        const quantity = parseInt(row[0]);
                        const sku = row[1];
                        
                        if (sku && quantity > 0) {
                            const product = allProducts.find(p => p.sku === sku.trim());
                            if (product) {
                                newOrder.push({ ...product, quantity, manualLock: false });
                            } else {
                                notFound.push(sku);
                            }
                        }
                    });

                    currentOrder = newOrder;
                    updateAllPricesInOrder();
                    if (notFound.length > 0) {
                        alert(`Se importó el pedido, pero los siguientes SKUs no se encontraron en el catálogo actual y fueron omitidos:\n${notFound.join(', ')}`);
                    }
                    event.target.value = '';
                }
            });
        }

        function copyToClipboard(text, message) {
            const out = document.getElementById('copyOutput');
            out.textContent = text;
            out.style.display = 'block';
            navigator.clipboard.writeText(text).then(() => alert(message), () => alert('Error al copiar.'));
        }
